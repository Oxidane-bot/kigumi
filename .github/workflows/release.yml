name: Release

on:
  push:
    tags: ["v*"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev --python 3.13
      - name: Verify annotated tag
        run: |
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          tag_commit="$(git rev-parse "$tag_ref^{}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
      - name: Verify version identity
        run: |
          VERSION="$(uv run python -c 'import kigumi; print(kigumi.__version__)')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Verify tracked tree is clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - run: uv run pytest -q

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build:
    needs: [quality, test, security]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv build
      - id: version
        run: echo "version=$(uv run python -c 'import kigumi; print(kigumi.__version__)')" >> "$GITHUB_OUTPUT"
      - run: uv run python scripts/verify_dist.py --expected-version "${{ steps.version.outputs.version }}"
      - name: Verify sdist metadata version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run python - "$EXPECTED_VERSION" <<'PY'
          import email
          import sys
          import tarfile
          from pathlib import Path

          expected = sys.argv[1]
          path = Path("dist") / f"kigumi-{expected}.tar.gz"
          with tarfile.open(path, "r:gz") as archive:
              metadata_paths = [
                  member for member in archive.getmembers() if member.name.endswith("/PKG-INFO")
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit(f"expected one sdist PKG-INFO, found {len(metadata_paths)}")
              handle = archive.extractfile(metadata_paths[0])
              if handle is None:
                  raise SystemExit("sdist PKG-INFO is not readable")
              metadata = email.message_from_bytes(handle.read())
          if metadata["Version"] != expected:
              raise SystemExit(
                  f"sdist metadata version {metadata['Version']!r} != {expected!r}"
              )
          PY
      - name: Verify source and distribution release identity
        run: KIGUMI_DIST_DIR=dist uv run pytest -q tests/test_version.py tests/test_docs.py tests/test_schema_consistency.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/kigumi-*.whl
            dist/kigumi-*.tar.gz
          if-no-files-found: error

  distribution-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        format: ["wheel", "sdist"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install and smoke ${{ matrix.format }}
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          venv_dir=".dist-${{ matrix.python-version }}-${{ matrix.format }}-venv"
          uv venv --python "${{ matrix.python-version }}" "$venv_dir"
          if [ "${{ matrix.format }}" = "wheel" ]; then
            uv pip install --python "$venv_dir/bin/python" dist/*.whl
          else
            uv pip install --python "$venv_dir/bin/python" dist/*.tar.gz
          fi
          uv pip check --python "$venv_dir/bin/python"
          KIGUMI_EXPECTED_VERSION="$EXPECTED_VERSION" \
            "$venv_dir/bin/python" scripts/smoke_installed.py

  publish:
    needs: [quality, test, build, distribution-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    needs: [publish, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Wait for PyPI and verify published hashes
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          version = os.environ["VERSION"]
          with urllib.request.urlopen(f"https://pypi.org/pypi/kigumi/{version}/json", timeout=30) as response:
              payload = json.load(response)
          wheel_paths = sorted(Path("dist").glob("kigumi-*.whl"))
          sdist_paths = sorted(Path("dist").glob("kigumi-*.tar.gz"))
          if len(wheel_paths) != 1 or len(sdist_paths) != 1:
              raise SystemExit(
                  "local dist must contain exactly one kigumi wheel and one sdist: "
                  f"wheels={wheel_paths} sdists={sdist_paths}"
              )
          local_paths = wheel_paths + sdist_paths
          local_names = {path.name for path in local_paths}
          published = {
              item["filename"]: item["digests"]["sha256"]
              for item in payload["urls"]
          }
          if len(published) != 2 or set(published) != local_names:
              raise SystemExit(
                  "PyPI release must expose exactly one wheel and one sdist: "
                  f"published={sorted(published)}"
              )
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in local_paths
          }
          if published != local:
              raise SystemExit(f"PyPI/local hash mismatch: published={published} local={local}")
          PY
            then break; fi
            test "$attempt" -lt 6
            sleep 10
          done
      - name: Install from PyPI and smoke public API
        run: |
          uv venv --python 3.13 .pypi-venv
          uv pip install --python .pypi-venv/bin/python "kigumi==$VERSION"
          uv pip check --python .pypi-venv/bin/python
          KIGUMI_EXPECTED_VERSION="$VERSION" .pypi-venv/bin/python scripts/smoke_installed.py

  github-release:
    needs: [verify-pypi, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes
        run: |
          awk -v heading="## [$VERSION]" \
            'index($0, heading) == 1 {emit=1; next} /^## \[/{emit=0} emit' \
            CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/kigumi-*.whl dist/kigumi-*.tar.gz \
            --title "Kigumi $VERSION" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
